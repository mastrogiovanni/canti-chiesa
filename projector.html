<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Proiezione — Canti in Chiesa</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; }
    body { display: grid; place-items: center; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
    main { width: min(92vw, 1500px); text-align: center; }
    #title { position: fixed; top: 4vh; left: 0; width: 100%; font: 500 clamp(14px, 1.6vw, 25px)/1.3 system-ui, sans-serif; letter-spacing: .12em; opacity: .56; }
    #lyrics { font-size: clamp(34px, 5vw, 76px); line-height: 1.38; font-weight: 500; letter-spacing: .015em; text-wrap: balance; text-shadow: 0 2px 20px #000; }
    #lyrics span { display: block; }
    #idle { font: 500 clamp(20px, 2vw, 30px)/1.5 system-ui, sans-serif; letter-spacing: .08em; opacity: .82; }
    #number { position: fixed; right: 3vw; bottom: 2.5vh; font: 16px system-ui, sans-serif; opacity: .38; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <div id="title"></div>
    <div id="lyrics"></div>
    <div id="idle"></div>
    <div id="number"></div>
  </main>
  <script>
    const title = document.querySelector('#title');
    const lyrics = document.querySelector('#lyrics');
    const idle = document.querySelector('#idle');
    const number = document.querySelector('#number');
    async function refresh() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        const s = await response.json();
        title.textContent = s.active ? s.title : '';
        lyrics.replaceChildren();
        idle.textContent = '';
        number.textContent = '';
        if (s.active && s.page > 0) {
          for (const line of s.slides[s.page - 1]) {
            const span = document.createElement('span');
            span.textContent = line;
            lyrics.append(span);
          }
          number.textContent = `${s.page} / ${s.pages}`;
        } else if (!s.active && s.idle === 'logo') {
          idle.textContent = '✦  PARROCCHIA  ✦';
        }
      } catch (_) { idle.textContent = 'Server non disponibile'; }
    }
    refresh();
    setInterval(refresh, 350);
    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
    });
  </script>
</body>
</html>
